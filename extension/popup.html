<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Copy as Markdown</title>
  <style>
    /* The popup inherits the browser theme, so every colour is set explicitly —
       otherwise the text renders dark-on-dark for dark-theme users. */
    :root {
      --bg: #ffffff;
      --text: #202124;
      --muted: #5f6368;
      --button-bg: #f7f7f7;
      --button-hover: #ececec;
      --border: #cccccc;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #202124;
        --text: #e8eaed;
        --muted: #9aa0a6;
        --button-bg: #303134;
        --button-hover: #3c4043;
        --border: #5f6368;
      }
    }
    body {
      width: 220px;
      font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
      padding: 12px;
      margin: 0;
      background: var(--bg);
      color: var(--text);
    }
    button {
      width: 100%;
      padding: 8px 10px;
      margin-bottom: 8px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--button-bg);
      color: var(--text);
      cursor: pointer;
      font-size: 13px;
    }
    button:hover {
      background: var(--button-hover);
    }
    #hint {
      font-size: 11px;
      color: var(--muted);
      line-height: 1.4;
    }
    #status {
      font-size: 12px;
      color: var(--text);
      min-height: 16px;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <button id="copy">Copy as Markdown</button>
  <div id="hint">Copies your selection, or the whole page if nothing is selected.</div>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
