# Publishes a GitHub release when a version tag (v1.2.3) is pushed.
# The zip is built the same way as tools/package.ps1: the committed contents of
# extension/, with manifest.json at the root, ready to upload to Edge Add-ons.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the manifest version
        run: |
          version=$(jq -r .version extension/manifest.json)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match manifest version $version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Build the zip
        run: |
          zip="copy-as-markdown-$GITHUB_REF_NAME.zip"
          git archive --format=zip --output "$zip" HEAD:extension
          unzip -l "$zip"
          unzip -l "$zip" | grep -q " manifest.json$" || { echo "::error::manifest.json is not at the zip root"; exit 1; }
          echo "ZIP=$zip" >> "$GITHUB_ENV"

      - name: Take the release notes from CHANGELOG.md
        run: |
          awk -v v="$VERSION" '
            /^## / { found = ($2 == v); next }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no section for $VERSION"
            exit 1
          fi
          cat notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "$ZIP" --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
